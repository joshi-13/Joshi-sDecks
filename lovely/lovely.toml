[manifest]
version = "1.0.0"
priority = 0

# Define a var substitution rule. This searches for lines that contain {{lovely:var_name}}
# (var_name from this example, it can really be anything) and replaces each match with the
# provided value.


# Add Legendary to Joker ObjectType

[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/game_object.lua"]'''
pattern = '''
{ key = "Common" },
{ key = "Uncommon" },
{ key = "Rare" },
'''
position = "after"
payload = '''{ key = "Legendary" }, '''
match_indent = true
times = 1